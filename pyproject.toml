[project]
name = "road-network-analyzer"
version = "0.1.0"
description = "Visualize road vector data and find shortest paths"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57.0",  # needs st.components.v2 for the live-geolocation component
    "streamlit-folium>=0.20.0",
    "geopandas>=0.14.0",
    "networkx>=3.3",
    "folium>=0.16.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pyogrio>=0.7.0",
    "matplotlib",
    "mapclassify",
]

